# YOLOv8n + Coordinate Attention -- PHASE 3b (the project spec section 3).
#
# Identical to Ultralytics' stock yolov8.yaml at scale 'n' (depth=0.33,
# width=0.25, max_channels=1024 -- copied verbatim from
# ultralytics/cfg/models/v8/yolov8.yaml), with exactly ONE change: a
# CoordinateAttention layer inserted at the end of the backbone, before the
# neck (right after SPPF). No other layer, connection, or hyperparameter
# differs from the plain yolov8n architecture Phase 3a trained.
#
# This file is SCALE-SPECIFIC (no `scales:` block, no yolov8n/s/m/l/x
# selection) -- depth_multiple/width_multiple/max_channels are set directly
# for 'n' only. That is deliberate: CoordinateAttention's channel count below
# (256) is only correct for width=0.25, and ultralytics does not auto-scale
# custom-module arguments the way it does for its own layers (Conv, C2f, ...).
# Using this file at any other scale would build successfully but feed the
# wrong number of channels into CoordinateAttention -- caught by the
# assertion in attention.py's forward(), not silently.
#
# INDEX BOOKKEEPING (why this is the "insert one layer, renumber everything
# after it" step the project spec's integration constraints warn about): inserting
# CoordinateAttention as new layer 10 shifts every original head layer index
# by +1. Two ABSOLUTE (not `-1`) references in the stock yolov8.yaml head had
# to be updated by hand:
#   - `[-1, 6]` (P4 skip)  -> unchanged, 6 is still the backbone's P4 C2f
#     output; backbone layers 0-9 don't move.
#   - `[-1, 4]` (P3 skip)  -> unchanged, same reasoning as above.
#   - `[-1, 12]` (P4 neck feature, old numbering) -> becomes `[-1, 13]`,
#     because that layer's own position shifted by the insertion.
#   - `[-1, 9]` (P5 skip, old numbering, raw SPPF output) -> becomes
#     `[-1, 10]`, deliberately pointing at CoordinateAttention's OUTPUT
#     instead of SPPF's raw output. This is the one place a plain "shift
#     every index by 1" pass would still be wrong: layer 9 (SPPF) still
#     exists at index 9, so a naive renumbering could leave this reference
#     unchanged and compile without error -- but that would mean the P5/large
#     detection branch bypasses CA entirely, contradicting "CA is inserted
#     between the backbone and the neck" (some neck branches would see
#     un-recalibrated features). Pointing it at 10 instead makes CA the actual
#     single hand-off point between backbone and every neck branch, as intended.

nc: 4          # D00, D10, D20, D40 -- matches config/dataset_source.yaml
depth_multiple: 0.33
width_multiple: 0.25
max_channels: 1024

# YOLOv8n backbone (unchanged from stock yolov8.yaml)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]     # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]    # 1-P2/4
  - [-1, 3, C2f, [128, True]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]    # 3-P3/8
  - [-1, 6, C2f, [256, True]]     # 4
  - [-1, 1, Conv, [512, 3, 2]]    # 5-P4/16
  - [-1, 6, C2f, [512, True]]     # 6
  - [-1, 1, Conv, [1024, 3, 2]]   # 7-P5/32
  - [-1, 3, C2f, [1024, True]]    # 8
  - [-1, 1, SPPF, [1024, 5]]      # 9 -- end of backbone

# YOLOv8n + CA head
head:
  - [-1, 1, CoordinateAttention, [256]]   # 10 -- NEW: channels = make_divisible(1024*0.25, 8) = 256

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]              # 12 -- cat backbone P4 (index 6, unaffected by insertion)
  - [-1, 3, C2f, [512]]                    # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]              # 15 -- cat backbone P3 (index 4, unaffected by insertion)
  - [-1, 3, C2f, [256]]                    # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]             # 17
  - [[-1, 13], 1, Concat, [1]]             # 18 -- cat head P4 (was index 12, now 13 after shift)
  - [-1, 3, C2f, [512]]                    # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]             # 20
  - [[-1, 10], 1, Concat, [1]]             # 21 -- cat CA output (was `[-1, 9]` = raw SPPF; see note above)
  - [-1, 3, C2f, [1024]]                   # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]]        # 23 -- Detect(P3, P4, P5); indices shifted +1 from stock (15,18,21)
