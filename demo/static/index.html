<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Damage Detector</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="page">
  <header class="page-header">
    <h1>Road Damage Detector</h1>
    <p class="subtitle">Multi-model object detection, trained on RDD2022.</p>
  </header>

  <div class="card">
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Upload a road image">
      <input type="file" id="fileInput" accept="image/jpeg,image/png" hidden>
      <p class="dropzone-text">Drag &amp; drop a road image here, or</p>
      <button type="button" class="btn-choose" id="chooseBtn">Choose an image</button>
    </div>

    <div class="control-row">
      <label for="modelSelect">Model</label>
      <select id="modelSelect"></select>
    </div>

    <div class="control-row">
      <label for="confidence">Confidence threshold: <span id="confidenceValue">0.25</span></label>
      <input type="range" id="confidence" min="0.05" max="0.9" step="0.05" value="0.25">
    </div>

    <button class="btn-analyze" id="analyzeBtn" disabled>Analyze image</button>
    <button class="btn-compare" id="compareBtn" disabled>Compare all models</button>
    <p class="format-note">Accepted formats: jpg, png — one image at a time.</p>
    <p class="error-text" id="errorText" hidden></p>
  </div>

  <div class="result-card" id="resultCard" hidden>
    <div class="result-loading" id="resultLoading" hidden>
      <div class="spinner"></div>
      <p id="resultLoadingText">Running detection…</p>
    </div>
    <div class="result-content" id="resultContent" hidden>
      <img id="resultImage" alt="Detected road damage">
      <p class="result-summary" id="resultSummary"></p>
      <table class="detections-table" id="detectionsTable">
        <thead><tr><th>Damage type</th><th>Confidence</th></tr></thead>
        <tbody id="detectionsBody"></tbody>
      </table>
    </div>
    <div class="compare-grid" id="compareGrid" hidden></div>
  </div>
</div>

<script src="/script.js"></script>
</body>
</html>
